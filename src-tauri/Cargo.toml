[package]
name = "image-toolkit"
version = "0.1.0"
description = "Transparent desktop GUI for image processing tools"
authors = ["wrench"]
license = "MIT"
edition = "2021"

[lib]
name = "image_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.2.2"
